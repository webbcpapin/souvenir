<section class="catalog-status" aria-live="polite" id="catalog-status">
  <span id="connection-status">Hubungkan akun Google untuk memuat stok terkini.</span>
  <button id="connect-google" type="button">Hubungkan Google</button>
  <button id="reload-stock" type="button">Muat Ulang</button>
</section>
<section class="catalog-views" aria-label="Tampilan katalog">
  <button type="button" data-view="active" aria-pressed="true">Barang Aktif</button>
  <button type="button" data-view="inactive" aria-pressed="false">Barang Nonaktif</button>
  <button type="button" data-view="history" aria-pressed="false">Riwayat Transaksi</button>
  <p id="unit-summary"></p>
</section>
<dialog class="catalog-dialog" id="movement-dialog">
  <form id="movement-form">
    <h2 id="movement-title">Barang Masuk</h2>
    <label>Barang<select name="item_id" required></select></label>
    <p class="form-hint" id="movement-stock"></p>
    <div class="form-grid">
      <label>Tanggal<input type="date" name="date" required></label>
      <label>Jumlah<input type="number" name="quantity" min="1" max="1000000000" step="1" required></label>
    </div>
    <label><span id="person-label">Pemasok / penyerah</span><input name="person" maxlength="250" required></label>
    <label>Nomor referensi<input name="reference" maxlength="250"></label>
    <label>Keperluan / catatan<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
    <p class="form-error" role="alert"></p>
    <div class="dialog-buttons"><button type="button" data-close>Batal</button><button class="primary" type="submit">Simpan Transaksi</button></div>
  </form>
</dialog>
<dialog class="catalog-dialog" id="edit-dialog">
  <form id="edit-form">
    <h2>Edit Barang</h2>
    <label>Barang<select name="item_id" required></select></label>
    <div class="form-grid">
      <label>Kode barang<input name="code" readonly></label>
      <label>Satuan<input name="unit" readonly></label>
    </div>
    <label>Nama barang<input name="name" required maxlength="250"></label>
    <label>Kategori<input name="category" required maxlength="250"></label>
    <div class="form-grid">
      <label>Lokasi penyimpanan<input name="location" maxlength="250"></label>
      <label>Batas stok minimum<input name="min_stock" type="number" min="0" max="1000000000" step="1" required></label>
    </div>
    <label>Catatan<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
    <label>Ganti foto (JPG, PNG, WebP, maksimal 2 MB)<input id="edit-photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <img id="edit-photo-preview" class="photo-preview" alt="Pratinjau foto barang" hidden>
    <p class="form-hint">Ubah stok melalui Barang Masuk atau Barang Keluar.</p>
    <p class="form-error" role="alert"></p>
    <div class="dialog-buttons"><button type="button" data-close>Batal</button><button class="primary" type="submit">Simpan Perubahan</button></div>
  </form>
</dialog>
<dialog class="catalog-dialog" id="add-dialog">
  <form id="add-form">
    <h2>Tambah Barang</h2>
    <div class="form-grid">
      <label>Kode unik<input name="code" required maxlength="250" pattern="[A-Za-z0-9][A-Za-z0-9_-]*"></label>
      <label>Satuan<input name="unit" required maxlength="250" placeholder="Sesuai satuan barang"></label>
    </div>
    <label>Nama barang<input name="name" required maxlength="250"></label>
    <label>Kategori<input name="category" required maxlength="250"></label>
    <div class="form-grid">
      <label>Saldo awal<input name="stock" type="number" min="0" max="1000000000" step="1" value="0" required></label>
      <label>Batas stok minimum<input name="min_stock" type="number" min="0" max="1000000000" step="1" value="0" required></label>
    </div>
    <label>Lokasi penyimpanan<input name="location" maxlength="250"></label>
    <label>Catatan<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
    <label>Foto (JPG, PNG, WebP, maksimal 2 MB)<input id="add-photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <img id="add-photo-preview" class="photo-preview" alt="Pratinjau foto barang baru" hidden>
    <p class="form-error" role="alert"></p>
    <div class="dialog-buttons"><button type="button" data-close>Batal</button><button class="primary" type="submit">Simpan Barang</button></div>
  </form>
</dialog>
<dialog class="catalog-dialog" id="delete-dialog">
  <form id="delete-form">
    <h2 id="delete-title">Hapus Barang</h2>
    <p id="delete-summary"></p>
    <p class="form-hint" id="delete-hint">Barang menjadi nonaktif. Riwayat dan foto tetap tersimpan. Penghapusan hanya diizinkan jika stok nol.</p>
    <p class="form-error" role="alert"></p>
    <div class="dialog-buttons"><button type="button" data-close>Batal</button><button class="primary" type="submit">Hapus Barang</button></div>
  </form>
</dialog>
<div class="catalog-toast" id="catalog-toast" role="status" hidden></div>
