<style>
/* Kontrol tambahan; CSS dan susunan visual katalog sumber dipertahankan. */
.navbar { flex-wrap: wrap; }
.nav-left { flex-wrap: wrap; }
.navbar .catalog-menu { border: 0; background: transparent; color: white; padding: 21px 15px; font: inherit; font-size: 14px; cursor: pointer; }
.navbar .catalog-menu:hover { background: rgba(255,255,255,.15); }
.catalog-status { max-width: 1100px; margin: 15px auto -20px; padding: 10px 15px; border-radius: 8px; background: rgba(255,255,255,.94); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; color: #075b8e; }
.catalog-status.error { color: #9e2222; }
.catalog-status button, .catalog-status a { border: 0; background: #0876b9; color: white; border-radius: 5px; padding: 7px 10px; cursor: pointer; text-decoration: none; font: inherit; }
.card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 10px 12px; position: relative; z-index: 3; }
.card-actions button { border: 1px solid rgba(255,255,255,.6); border-radius: 5px; padding: 6px 9px; background: rgba(0,0,0,.12); color: white; font: inherit; font-size: 12px; cursor: pointer; }
.card-actions button:hover { background: rgba(0,0,0,.26); }
.card-actions button:disabled { opacity: .5; cursor: default; }
.catalog-dialog { position: fixed; inset: 0; margin: auto; border: 0; border-radius: 10px; padding: 24px; width: min(560px,calc(100% - 28px)); max-height: 90vh; overflow: auto; box-shadow: 0 15px 60px #0006; color: #333; }
.catalog-dialog::backdrop { background: #001e37aa; }
.catalog-dialog h2 { color: #0876b9; margin: 0 0 14px; font-size: 22px; }
.catalog-dialog label { display: block; margin: 12px 0; font-size: 14px; font-weight: bold; }
.catalog-dialog input, .catalog-dialog select, .catalog-dialog textarea { display: block; width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #bbb; border-radius: 5px; color: #333; background: white; font: inherit; }
.catalog-dialog input[readonly] { background: #f0f0f0; }
.catalog-dialog .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.catalog-dialog .form-hint { margin: 12px 0; font-size: 13px; line-height: 1.5; color: #555; }
.catalog-dialog .form-error { color: #a52626; margin: 12px 0; line-height: 1.4; }
.dialog-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.dialog-buttons button { border: 0; border-radius: 5px; padding: 10px 16px; font: inherit; background: #eee; cursor: pointer; }
.dialog-buttons .primary { background: #0876b9; color: white; }
.dialog-buttons button:disabled { opacity: .6; cursor: wait; }
.catalog-dialog #edit-photo-preview { width: 90px; height: 90px; object-fit: contain; }
.catalog-toast { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); background: #082f49; color: white; border-radius: 8px; padding: 12px 18px; max-width: calc(100% - 30px); box-shadow: 0 4px 20px #0004; }
[hidden] { display: none !important; }
@media(max-width:600px) { .navbar { padding: 0 12px; } .navbar .catalog-menu { padding: 14px 10px; } .catalog-status { margin: 15px 20px -10px; } .catalog-dialog .form-grid { grid-template-columns: 1fr; } }
/* Layout tambahan menjaga kartu oranye dan latar asli. */
.menu-card { min-width: 0; height: auto; min-height: 270px; animation-delay: 0s !important; }
.menu-title h2 { overflow-wrap: anywhere; line-height: 1.35; padding: 0 12px; font-size: 19px; }
.stock-unit { font-size: 16px; font-weight: normal; }
.stock-line { position: relative; z-index: 2; }
.item-code { font-size: 12px; margin: 8px; }
.photo-empty,.photo-warning { font-size: 12px; margin: 8px; }
.catalog-views { max-width:1100px; margin: 32px auto 0; padding:0 15px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.catalog-views button { border:1px solid #0876b9; border-radius:6px; background:white; color:#075b8e; padding:9px 12px; cursor:pointer; font:inherit; }
.catalog-views button[aria-pressed="true"] { background:#0876b9; color:white; }
#unit-summary { width:100%; background:#fffc; border-radius:6px; padding:10px; font-size:14px; }
.catalog-empty { grid-column:1/-1; background:#fffe; padding:24px; border-radius:8px; color:#075b8e; }
.history-view { display:block; }
.history-list { background:#fffe; border-radius:10px; padding:18px; }
.history-entry { border-bottom:1px solid #ddd; padding:12px 0; overflow-wrap:anywhere; }
.history-entry p { margin:6px 0; }
.catalog-dialog .photo-preview { width:100px; height:100px; object-fit:contain; }
.catalog-dialog,.catalog-dialog * { box-sizing:border-box; }
.catalog-dialog { max-width:calc(100vw - 28px); }
.catalog-dialog select { text-overflow:ellipsis; }
.dialog-buttons { flex-wrap:wrap; }
#delete-summary { overflow-wrap:anywhere; line-height:1.6; }
.navbar .catalog-menu[data-action="add"] { background:#fff; color:#075b8e; border-radius:6px; margin:8px 5px; padding:12px; font-weight:bold; }
@media(max-width:600px){ .nav-left{justify-content:center;width:100%;} .catalog-views{margin:30px 15px 0;padding:0;} .menu-title h2{font-size:18px;} .catalog-dialog{padding:18px;} .total-number{font-size:48px;} }
@media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} .menu-card{opacity:1;} }

</style>
